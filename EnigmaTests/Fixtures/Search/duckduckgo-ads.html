  </div>
  <div class="result results_links results_links_deep result--ad">

    </div>
  </div>
  <div class="result results_links results_links_deep web-result">
    <div class="links_main links_deep result__body">
      <h2 class="result__title"><a class="result__a" href="https://organic.example/a">Organic result</a></h2>
      <a class="result__snippet" href="https://organic.example/a">An <b>organic</b> snippet.</a>

  <div class="result results_links results_links_deep web-result">

  </div>

  </div>
  <div class="result results_links results_links_deep web-result">
    <div class="links_main links_deep result__body">
